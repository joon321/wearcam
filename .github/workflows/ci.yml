name: CI

on:
  pull_request:
  push:
    branches: [main, work]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.7.0
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run check

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.35.2
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4.4.2
        with:
          gradle-version: "8.12"
      - run: flutter doctor -v
      - name: Generate Flutter 3.35.2 platform baseline
        run: >-
          flutter create --platforms=android,ios --org=com.wearcam.template
          --project-name=wearcam_platform_baseline --no-pub
          $RUNNER_TEMP/wearcam-platform-baseline
      - name: Verify reconciled platform files
        run: |
          test -f "$RUNNER_TEMP/wearcam-platform-baseline/android/app/src/debug/AndroidManifest.xml"
          test -f "$RUNNER_TEMP/wearcam-platform-baseline/ios/Flutter/Debug.xcconfig"
          test -f android/app/src/debug/AndroidManifest.xml
          test -f android/app/src/profile/AndroidManifest.xml
          test -f ios/Flutter/Debug.xcconfig
          test -f ios/Flutter/Profile.xcconfig
          test -f ios/Flutter/Release.xcconfig
          grep -q 'applicationId = "com.wearcam.bridge"' android/app/build.gradle.kts
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.wearcam.bridge' ios/Runner.xcodeproj/project.pbxproj
      - run: flutter pub get
      - run: dart format .
      - run: flutter analyze
      - run: flutter test
      - run: gradle wrapper --gradle-version 8.12 --distribution-type all
        working-directory: mobile/android
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wearcam-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
