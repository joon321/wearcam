name: wearcam
description: Privacy-first spoken camera bridge.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2
  # Keep the Android/iOS native WebRTC runtime explicit; 1.6.2 includes the
  # current libwebrtc engine used to avoid older Android network-thread crashes.
  flutter_webrtc: 1.6.2
  http: ^1.5.0
  image: ^4.5.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
