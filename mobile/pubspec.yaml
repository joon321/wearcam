name: wearcam
description: Privacy-first spoken camera bridge.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2
  # Pin the WebRTC version used by this physical-device prototype; pubspec.lock
  # locks its complete transitive dependency graph.
  flutter_webrtc: 1.2.0
  http: ^1.5.0
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
